name: Consumidor de Pipeline Node

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Permite ejecución manual

jobs:
  call-reusable-node-18:
    uses: ./.github/workflows/reusable.yml
    with:
      node-version: '18.x'

  call-reusable-node-20:
    uses: ./.github/workflows/reusable.yml
    with:
      node-version: '20.x'

  post-process:
    needs: call-reusable-node-20
    runs-on: ubuntu-latest
    steps:
      - name: Lógica adicional propia
        run: |
          echo "El workflow reutilizable finalizó correctamente."
          echo "El artifact generado se llama: ${{ needs.call-reusable-node-20.outputs.artifact-name }}"
